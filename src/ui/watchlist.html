<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watchlist · IKEA Tweedekans</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <main>
      <h1>Watchlist</h1>
      <p class="lead">
        Producten die je in de gaten houdt. Je krijgt een melding zodra ze in de
        tweedekanshoek van een gevolgd filiaal verschijnen.
      </p>
      <a href="/trips" class="banner-good" id="tripBanner" hidden></a>
      <section class="panel" id="alertPanel" hidden>
        <div class="row">
          <h2 style="margin: 0">Meldingen</h2>
          <button class="secondary" id="seen">Alles gezien</button>
          <a href="/alerts" class="btn">Alle meldingen →</a>
        </div>
        <div id="alerts"></div>
      </section>
      <div class="grid" id="items"></div>
    </main>
    <script src="/assets/app.js"></script>
    <script>
      const {
        $,
        el,
        api,
        send,
        money,
        ago,
        initShell,
        insightChips,
        empty,
        chip,
      } = App;
      const refreshShell = initShell("watchlist");

      async function loadTrips() {
        const banner = $("tripBanner");
        try {
          const data = await api("/api/trips");
          const r = data.configured ? data.bestRoute : undefined;
          banner.hidden = !r?.worthIt;
          if (!r?.worthIt) return;
          const names = r.stops.map((st) => st.storeName);
          const route =
            names.length === 1
              ? `naar ${names[0]}`
              : names.length === 2
                ? `naar ${names[0]} via ${names[1]}`
                : `naar ${names[0]} via ${names.slice(1, -1).join(", ")} naar ${names[names.length - 1]}`;
          const units = r.stops.reduce(
            (n, st) => n + st.units.reduce((m, u) => m + u.count, 0),
            0,
          );
          banner.replaceChildren(
            el("strong", {
              textContent: `Een ritje ${route} is rendabel: +${money(r.net)} netto`,
            }),
            el("span", {
              textContent: ` · ${r.totalKm} km totaal, ${units} stuks, besparing ${money(r.saving)} min ${money(r.tripCost)} brandstof`,
            }),
          );
        } catch {
          banner.hidden = true; // trip check is optional; never block the watchlist
        }
      }

      async function loadAlerts() {
        const unseen = (await api("/api/alerts?limit=200")).items.filter(
          (a) => !a.seen,
        );
        $("alertPanel").hidden = unseen.length === 0;
        $("alerts").replaceChildren(
          ...unseen.map((a) =>
            el(
              "div",
              { className: "alert" },
              el("strong", {
                textContent: `${a.title} ligt in ${a.storeName} voor ${money(a.price)}!`,
              }),
              el("span", {
                className: "meta",
                textContent: `${a.description} · ${ago(a.createdAt)}`,
              }),
              el("a", {
                href: `/product/${a.articleNumber}`,
                textContent: "Bekijk product",
              }),
            ),
          ),
        );
      }

      async function loadItems() {
        const items = await api("/api/watchlist");
        if (!items.length) {
          $("items").replaceChildren(
            empty(
              'Nog niets op je watchlist. Zoek een product onder "Zoeken in producten".',
            ),
          );
          return;
        }
        $("items").replaceChildren(
          ...items.map((i) => {
            const rm = el("button", {
              className: "secondary",
              textContent: "Verwijderen",
            });
            rm.onclick = async () => {
              await send(`/api/watchlist/${i.articleNumber}`, "DELETE");
              loadItems();
            };
            const chips = insightChips(i.insight);
            const qty = el("input", {
              type: "number",
              min: 1,
              max: 99,
              value: i.quantity,
              style: "width: 70px",
              ariaLabel: "Aantal nodig",
            });
            qty.onchange = async () => {
              const n = Math.min(
                Math.max(Math.round(Number(qty.value)) || 1, 1),
                99,
              );
              qty.value = n;
              await send(`/api/watchlist/${i.articleNumber}/quantity`, "PUT", {
                quantity: n,
              });
            };
            return el(
              "div",
              { className: "card" },
              el(
                "a",
                { href: `/product/${i.articleNumber}` },
                el("img", { src: i.image || "", loading: "lazy", alt: "" }),
              ),
              el(
                "div",
                { className: "body" },
                el("a", {
                  className: "title",
                  href: `/product/${i.articleNumber}`,
                  style: "color:inherit;text-decoration:none",
                  textContent: `${i.name} ${i.typeName}`,
                }),
                el("div", {
                  className: "meta",
                  textContent: `art. ${i.articleNumber}${i.measure ? " · " + i.measure : ""}`,
                }),
                chips.length
                  ? chips
                  : el(
                      "div",
                      { className: "chips" },
                      chip("Niet in tweedekanshoek"),
                    ),
                i.insight?.lowestEver !== undefined && i.insight.offers.length
                  ? el("div", {
                      className: "meta",
                      textContent: `Laagste ooit gemeten: ${money(i.insight.lowestEver)}`,
                    })
                  : null,
                el("div", { className: "spacer" }),
                el("label", { className: "meta" }, "Aantal nodig: ", qty),
                rm,
              ),
            );
          }),
        );
      }

      $("seen").onclick = async () => {
        await send("/api/alerts/seen", "POST");
        loadAlerts();
        refreshShell();
      };
      loadAlerts();
      loadItems();
      loadTrips();
      setInterval(() => {
        if (document.activeElement?.tagName === "INPUT") return;
        loadAlerts();
        loadItems();
        loadTrips();
      }, 60000);
    </script>
  </body>
</html>
