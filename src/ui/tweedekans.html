<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aanbod · Tweedekanshoek</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <main>
      <h1>Aanbod</h1>
      <p class="lead">
        Alle opgehaalde tweedekansproducten van alle filialen, met
        prijsvergelijking t.o.v. eerder gemeten prijzen.
      </p>
      <div class="toolbar">
        <input
          type="search"
          id="q"
          placeholder="Zoek op naam, omschrijving of artikelnummer"
        />
        <select id="store">
          <option value="">Alle filialen</option>
        </select>
        <select id="followed">
          <option value="">Gevolgde + overige filialen</option>
          <option value="1">Alleen gevolgde filialen</option>
          <option value="0">Alleen overige filialen</option>
        </select>
        <select id="recent">
          <option value="">Altijd</option>
          <option value="24">Nieuw &lt; 24 uur</option>
          <option value="72">Nieuw &lt; 3 dagen</option>
          <option value="168">Nieuw &lt; 7 dagen</option>
        </select>
        <select id="sort">
          <option value="new">Nieuwste eerst</option>
          <option value="priceAsc">Prijs: laag naar hoog</option>
          <option value="priceDesc">Prijs: hoog naar laag</option>
          <option value="discount">Grootste korting</option>
        </select>
      </div>
      <div id="status" class="hint"></div>
      <div class="grid" id="results"></div>
      <p><button class="secondary" id="more" hidden>Meer laden</button></p>
    </main>
    <script src="/assets/app.js"></script>
    <script>
      const { $, el, api, initShell, offerCard, debounce, empty } = App;
      initShell("tweedekans");
      const PAGE = 60;
      let offset = 0;
      let lastFollowed;

      async function load(append = false) {
        if (!append) offset = 0;
        const p = new URLSearchParams({
          q: $("q").value,
          store: $("store").value,
          followed: $("followed").value,
          newHours: $("recent").value,
          sort: $("sort").value,
          limit: PAGE,
          offset,
        });
        let data;
        try {
          data = await api("/api/offers?" + p);
        } catch (e) {
          $("status").textContent = `Fout: ${e.message}`;
          return;
        }
        if (!append) lastFollowed = undefined;
        const nodes = [];
        for (const o of data.items) {
          if (o.followed !== lastFollowed) {
            lastFollowed = o.followed;
            nodes.push(
              el("h2", {
                className: "group-title",
                textContent: o.followed
                  ? "Gevolgde filialen"
                  : "Overige filialen",
              }),
            );
          }
          nodes.push(offerCard(o));
        }
        if (append) $("results").append(...nodes);
        else
          $("results").replaceChildren(
            ...(nodes.length ? nodes : [empty("Geen aanbiedingen gevonden.")]),
          );
        offset += data.items.length;
        $("status").textContent = `${data.total} aanbiedingen`;
        $("more").hidden = offset >= data.total;
      }

      (async () => {
        const stores = await api("/api/stores");
        const group = (label, list) =>
          list.length
            ? el(
                "optgroup",
                { label },
                ...list.map((s) =>
                  el("option", {
                    value: s.storeId,
                    textContent: `${s.name} (${s.activeOffers})`,
                  }),
                ),
              )
            : null;
        $("store").append(
          ...[
            group(
              "Gevolgde filialen",
              stores.filter((s) => s.followed),
            ),
            group(
              "Overige filialen",
              stores.filter((s) => !s.followed),
            ),
          ].filter(Boolean),
        );
        load();
      })();
      $("q").oninput = debounce(() => load());
      for (const id of ["store", "followed", "recent", "sort"])
        $(id).onchange = () => load();
      $("more").onclick = () => load(true);
    </script>
  </body>
</html>
