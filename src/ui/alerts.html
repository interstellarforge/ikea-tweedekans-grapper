<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meldingen · IKEA Tweedekans</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <style>
      .table-wrap {
        overflow-x: auto;
      }
      tr.unseen td:first-child {
        border-left: 3px solid var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Meldingen</h1>
      <p class="lead">
        Geschiedenis van alle meldingen: wanneer een watchlist-product in een
        gevolgd filiaal verscheen en waar de melding naartoe is gestuurd.
      </p>
      <div class="row">
        <span id="status" class="hint"></span>
        <button class="secondary" id="seen">Alles gezien</button>
      </div>
      <div class="panel table-wrap">
        <table>
          <thead>
            <tr>
              <th>Wanneer</th>
              <th>Product</th>
              <th>Filiaal</th>
              <th>Prijs</th>
              <th>Prijsvergelijking</th>
              <th>Verzonden via</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p><button class="secondary" id="more" hidden>Meer laden</button></p>
    </main>
    <script src="/assets/app.js"></script>
    <script>
      const { $, el, api, send, money, empty, chip } = App;
      const refreshShell = App.initShell("alerts");
      const PAGE = 50;
      let offset = 0;
      const date = (ms) =>
        new Date(ms).toLocaleString("nl-NL", {
          dateStyle: "short",
          timeStyle: "short",
        });

      const deliveryCell = (a) => {
        if (!a.delivery)
          return el("span", { className: "meta", textContent: "bezig…" });
        const failed = a.delivery.includes("fout");
        return el("span", {
          className: failed ? "err" : "",
          textContent: a.delivery,
        });
      };

      const row = (a) =>
        el(
          "tr",
          { className: a.seen ? "" : "unseen" },
          el("td", { textContent: date(a.createdAt) }),
          el(
            "td",
            {},
            el("a", {
              href: `/product/${a.articleNumber}`,
              textContent: a.title,
            }),
            el("div", { className: "meta", textContent: a.description }),
          ),
          el("td", { textContent: a.storeName }),
          el("td", {}, el("strong", { textContent: money(a.price) })),
          el("td", { textContent: a.note || "–" }),
          el("td", {}, deliveryCell(a)),
          el(
            "td",
            {},
            el("a", {
              href: App.ikeaOfferUrl(a.storeName, a.offerNumber),
              target: "_blank",
              rel: "noopener",
              textContent: "IKEA ↗",
            }),
          ),
        );

      async function load(append = false) {
        if (!append) offset = 0;
        const data = await api(`/api/alerts?limit=${PAGE}&offset=${offset}`);
        const rows = data.items.map(row);
        if (append) $("rows").append(...rows);
        else $("rows").replaceChildren(...rows);
        offset += data.items.length;
        $("status").textContent =
          `${data.total} meldingen · ${data.unseen} ongezien`;
        $("more").hidden = offset >= data.total;
        if (!data.total)
          $("rows").replaceChildren(
            el(
              "tr",
              {},
              el("td", { colSpan: 7 }, empty("Nog geen meldingen.")),
            ),
          );
      }

      $("more").onclick = () => load(true);
      $("seen").onclick = async () => {
        await send("/api/alerts/seen", "POST");
        await load();
        refreshShell();
      };
      load();
    </script>
  </body>
</html>
