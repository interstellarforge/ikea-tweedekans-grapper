<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ritje-check · IKEA Tweedekans</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <style>
      #summary {
        margin: 0 0 14px;
      }
      h2.section {
        font-size: 16px;
        margin: 24px 0 10px;
      }
      .trip {
        padding: 14px 16px;
      }
      .trip.route.good {
        border-color: var(--good);
      }
      .trip.route.warn {
        border-color: var(--warn);
      }
      .trip header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
      }
      .trip h3 {
        margin: 0;
        font-size: 17px;
      }
      .net {
        margin-left: auto;
        font-size: 19px;
        font-weight: 800;
        white-space: nowrap;
      }
      .net.good {
        color: var(--good);
      }
      .net.warn {
        color: var(--warn);
      }
      .net.bad {
        color: var(--bad);
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        margin: 8px 0;
        color: var(--muted);
        font-size: 13px;
      }
      .stops {
        margin-top: 8px;
      }
      .stop {
        display: grid;
        grid-template-columns: minmax(170px, 1fr) 2fr auto;
        gap: 6px 14px;
        align-items: center;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .stop .where {
        font-weight: 700;
      }
      .stop .where small {
        display: block;
        font-weight: 400;
        color: var(--muted);
      }
      .stop .what {
        font-size: 14px;
      }
      .line {
        display: grid;
        grid-template-columns: minmax(170px, 2fr) auto auto auto;
        gap: 6px 14px;
        padding: 6px 0;
        border-top: 1px solid var(--line);
        font-size: 14px;
        align-items: baseline;
      }
      .line .num {
        text-align: right;
        white-space: nowrap;
      }
      details.alt {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 8px;
      }
      details.alt > summary {
        cursor: pointer;
        padding: 12px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: center;
        list-style: none;
      }
      details.alt > summary::-webkit-details-marker {
        display: none;
      }
      details.alt > summary .net {
        font-size: 16px;
      }
      details.alt > div {
        padding: 0 16px 12px;
      }
      .footer-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
      }
      @media (max-width: 700px) {
        .stop {
          grid-template-columns: 1fr auto;
        }
        .stop .what {
          grid-column: 1 / -1;
          order: 3;
        }
        .line {
          grid-template-columns: 1fr auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ritje-check</h1>
      <p class="lead">
        Is een rit de moeite waard? Besparing t.o.v. nieuwprijs op wat je nog
        nodig hebt (boodschappenlijst), minus brandstof en eventueel tijd.
      </p>
      <div id="summary" class="hint"></div>
      <div id="routes"></div>
      <div id="trips"></div>
    </main>
    <script src="/assets/app.js"></script>
    <script>
      const {
        $,
        el,
        api,
        send,
        money,
        chip,
        empty,
        initShell,
        duration,
        countryTag,
      } = App;
      initShell("trips");
      const state = { hourlyRate: 0 };

      const statusKind = (status) =>
        status === "good" ? "good" : status === "time" ? "warn" : "bad";
      const statusLabel = (status) =>
        status === "good"
          ? "Rendabel"
          : status === "time"
            ? "Rendabel in geld, niet in tijd"
            : "Niet de moeite waard";
      const signed = (n) => `${n >= 0 ? "+" : "−"}${money(Math.abs(n))}`;
      const storeLabel = (s) =>
        `${s.followed ? "★ " : ""}${s.storeName}${countryTag(s.country)}`;

      /** Small button that ticks the given units off the shopping list and recalculates. */
      const doneButton = (
        units,
        title = "Zet deze aantallen met deze prijzen als gekocht op je boodschappenlijst",
      ) => {
        const btn = el("button", {
          className: "secondary mini",
          textContent: "✓ Gehaald",
          title,
        });
        btn.onclick = async () => {
          btn.disabled = true;
          try {
            await send("/api/list/purchase", "POST", { items: units });
            await render();
          } catch (e) {
            btn.textContent = e.message;
          }
        };
        return btn;
      };

      const timeFacts = (x) => [
        el("span", {
          textContent: `Tijd: ${duration(x.driveMinutes)} rijden + ${duration(x.stopMinutes)} in de winkel = ${duration(x.totalMinutes)}`,
        }),
        ...(state.hourlyRate > 0
          ? [
              el("span", {
                textContent: `Tijdkosten: ${money(x.timeCost)} (${money(state.hourlyRate)}/uur)`,
              }),
              el("span", {
                textContent: `Netto in geld: ${money(x.moneyNet)}`,
              }),
            ]
          : []),
      ];

      const routeTitle = (r) => {
        const names = r.stops.map(storeLabel);
        return names.length === 1
          ? names[0]
          : names.length === 2
            ? `${names[0]} via ${names[1]}`
            : `${names[0]} via ${names.slice(1, -1).join(", ")} naar ${names[names.length - 1]}`;
      };

      const routeBody = (r) => [
        el(
          "div",
          { className: "facts" },
          el("span", {
            textContent: `${r.totalKm} km totaal`,
          }),
          ...timeFacts(r),
          el("span", { textContent: `Brandstof: ${money(r.tripCost)}` }),
          el("span", { textContent: `Besparing: ${money(r.saving)}` }),
          el("span", { textContent: `Te betalen: ${money(r.spend)}` }),
          r.approximateOrder
            ? el("span", {
                className: "err",
                textContent: "Volgorde is een benadering (meer dan 4 stops)",
              })
            : null,
        ),
        el(
          "div",
          { className: "stops" },
          ...r.stops.map((s) =>
            el(
              "div",
              { className: "stop" },
              el(
                "div",
                { className: "where" },
                storeLabel(s),
                el("small", {
                  textContent: `${s.legKm} km · ${duration(s.legMinutes)} rijden`,
                }),
              ),
              el("div", {
                className: "what",
                textContent: s.units
                  .map((u) => `${u.count}× ${u.name}`)
                  .join(", "),
              }),
              doneButton(
                s.units.map((u) => ({
                  articleNumber: u.articleNumber,
                  count: u.count,
                  unitPrice: Math.round((u.spend / u.count) * 100) / 100,
                  storeName: s.storeName,
                })),
              ),
            ),
          ),
        ),
      ];

      const bestPanel = (r) => {
        if (!r) return null;
        const gain = r.gainOverSingle;
        return el(
          "section",
          { className: `panel trip route ${statusKind(r.status)}` },
          el(
            "header",
            {},
            el("h3", { textContent: `Slimste route: ${routeTitle(r)}` }),
            chip(statusLabel(r.status), statusKind(r.status)),
            el("span", {
              className: `net ${statusKind(r.status)}`,
              textContent: signed(r.net),
            }),
          ),
          r.stops.length > 1 && r.bestSingleName
            ? el("div", {
                className: "facts",
                textContent:
                  gain > 0
                    ? `${money(gain)} beter dan alleen ${r.bestSingleName}`
                    : `Even goed als alleen ${r.bestSingleName}`,
              })
            : null,
          ...routeBody(r),
        );
      };

      const altRoute = (r) =>
        el(
          "details",
          { className: "alt" },
          el(
            "summary",
            {},
            el("strong", { textContent: routeTitle(r) }),
            chip(statusLabel(r.status), statusKind(r.status)),
            el("span", {
              className: "meta",
              textContent: `${r.totalKm} km · ${duration(r.totalMinutes)}`,
            }),
            el("span", {
              className: `net ${statusKind(r.status)}`,
              textContent: signed(r.net),
            }),
          ),
          el("div", {}, ...routeBody(r)),
        );

      const storeCard = (t) => {
        const lines = t.items.filter((i) => i.found > 0);
        return el(
          "section",
          { className: "panel trip" },
          el(
            "header",
            {},
            el("h3", { textContent: storeLabel(t) }),
            chip(statusLabel(t.status), statusKind(t.status)),
            el("span", {
              className: `net ${statusKind(t.status)}`,
              textContent: signed(t.net),
            }),
          ),
          el(
            "div",
            { className: "facts" },
            el("span", {
              textContent: `${t.oneWayKm} km enkele reis${t.distanceSource === "estimate" ? " (schatting)" : ""}`,
            }),
            ...timeFacts(t),
            el("span", { textContent: `Brandstof: ${money(t.tripCost)}` }),
            el("span", { textContent: `Besparing: ${money(t.saving)}` }),
            el("span", { textContent: `Te betalen: ${money(t.spend)}` }),
          ),
          ...lines.map((i) =>
            el(
              "div",
              { className: "line" },
              el("a", {
                href: `/product/${i.articleNumber}`,
                textContent: i.name,
              }),
              el("span", {
                className: "num",
                textContent: `${i.found} van ${i.wanted}`,
              }),
              el("span", { className: "num", textContent: money(i.spend) }),
              el("span", {
                className: "num meta",
                textContent: i.saving
                  ? `bespaart ${money(i.saving)}`
                  : "nieuwprijs onbekend",
              }),
            ),
          ),
          el(
            "div",
            { className: "footer-actions" },
            doneButton(
              lines.map((i) => ({
                articleNumber: i.articleNumber,
                count: i.found,
                unitPrice: Math.round((i.spend / i.found) * 100) / 100,
                storeName: t.storeName,
              })),
            ),
          ),
        );
      };

      async function render() {
        $("summary").textContent = "Afstanden berekenen…";
        let data;
        try {
          data = await api("/api/trips");
        } catch (e) {
          $("summary").textContent = "";
          $("trips").replaceChildren(empty(`Berekenen mislukt: ${e.message}`));
          return;
        }
        $("summary").textContent = "";
        if (!data.configured) {
          const target = data.reason.includes("postcode")
            ? ["/settings#ritje", "Naar instellingen"]
            : data.reason.includes("gehaald")
              ? ["/watchlist#boodschappen", "Naar boodschappenlijst"]
              : ["/watchlist", "Naar lijsten"];
          $("routes").replaceChildren();
          $("trips").replaceChildren(
            el(
              "div",
              { className: "empty" },
              `${data.reason}. `,
              el("a", { href: target[0], textContent: target[1] }),
            ),
          );
          return;
        }
        state.hourlyRate = data.hourlyRate;
        $("summary").textContent =
          `Vanaf ${data.postcode} · benzine ${money(data.fuelPrice)}/l · ${data.consumptionPer100km} l/100 km · ${data.wantedUnits} stuks nog nodig`;

        // The best route is shown first; single stores only when it is not itself a single store.
        const alternatives = data.alternatives;
        $("routes").replaceChildren(
          ...(data.bestRoute ? [bestPanel(data.bestRoute)] : []),
          ...(alternatives.length
            ? [
                el("h2", {
                  className: "section",
                  textContent: `Andere rendabele routes (${alternatives.length})`,
                }),
                ...alternatives.map(altRoute),
              ]
            : []),
        );

        const relevant = data.stores.filter((t) =>
          t.items.some((i) => i.found > 0),
        );
        const empties = data.stores.filter(
          (t) => !t.items.some((i) => i.found > 0),
        );
        $("trips").replaceChildren(
          el("h2", { className: "section", textContent: "Per filiaal" }),
          ...(relevant.length
            ? relevant.map(storeCard)
            : [empty("Niets van je lijst ligt nu in een filiaal.")]),
          ...(empties.length
            ? [
                el(
                  "details",
                  { className: "panel" },
                  el("summary", {
                    textContent: `${empties.length} filialen hebben niets van je lijst`,
                  }),
                  el(
                    "div",
                    { className: "facts" },
                    ...empties.map((t) =>
                      el("span", {
                        textContent: `${t.storeName}${countryTag(t.country)} (${t.oneWayKm} km)`,
                      }),
                    ),
                  ),
                ),
              ]
            : []),
        );
      }
      render();
    </script>
  </body>
</html>
