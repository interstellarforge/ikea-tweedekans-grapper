<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ritje-check · IKEA Tweedekans</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <style>
      .summary-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 28px;
        padding: 12px 16px;
        margin: 0 0 20px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
      }
      .summary-bar:empty {
        display: none;
      }
      .fact small {
        display: block;
        font-size: 12px;
        color: var(--muted);
      }
      .fact strong {
        font-size: 16px;
        font-variant-numeric: tabular-nums;
      }
      h2.section {
        font-size: 16px;
        margin: 24px 0 10px;
      }
      .trip {
        padding: 14px 16px;
      }
      .trip.route.good {
        border-color: var(--good);
      }
      .trip.route.warn {
        border-color: var(--warn);
      }
      .trip header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
      }
      .trip h3 {
        margin: 0;
        font-size: 18px;
        flex: 1 1 220px;
      }
      .trip + .trip {
        margin-top: 12px;
      }
      .net {
        margin-left: auto;
        font-size: 24px;
        font-weight: 800;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .net.good {
        color: var(--good);
      }
      .net.warn {
        color: var(--warn);
      }
      .net.bad {
        color: var(--bad);
      }
      .facts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
        gap: 12px 16px;
        margin: 14px 0;
        padding: 12px 0;
        border-block: 1px solid var(--line);
      }
      .stops {
        margin-top: 8px;
      }
      .stop {
        display: grid;
        grid-template-columns: minmax(170px, 1fr) 2fr auto;
        gap: 6px 14px;
        align-items: center;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .stop .where {
        font-weight: 700;
      }
      .stop .where small {
        display: block;
        font-weight: 400;
        color: var(--muted);
      }
      .stop .what {
        font-size: 14px;
      }
      .line {
        display: grid;
        grid-template-columns: minmax(170px, 2fr) auto auto auto;
        gap: 6px 14px;
        padding: 6px 0;
        border-top: 1px solid var(--line);
        font-size: 14px;
        align-items: baseline;
      }
      .line .num {
        text-align: right;
        white-space: nowrap;
      }
      details.alt {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 8px;
      }
      details.alt > summary {
        cursor: pointer;
        padding: 12px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: center;
        list-style: none;
      }
      details.alt > summary::-webkit-details-marker {
        display: none;
      }
      details.alt > summary .net {
        font-size: 16px;
      }
      details.alt > div {
        padding: 0 16px 12px;
      }
      .map-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 6px 0 4px;
      }
      .footer-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
      }
      @media (max-width: 700px) {
        .stop {
          grid-template-columns: 1fr auto;
        }
        .stop .what {
          grid-column: 1 / -1;
          order: 3;
        }
        .line {
          grid-template-columns: 1fr auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ritje-check</h1>
      <p class="lead">
        Is een rit de moeite waard? Besparing t.o.v. nieuwprijs op wat je nog
        nodig hebt (boodschappenlijst), minus brandstof en eventueel tijd.
      </p>
      <div id="summary" class="summary-bar"></div>
      <div id="routes"></div>
      <div id="trips"></div>
    </main>
    <script src="/assets/app.js"></script>
    <script>
      const {
        $,
        el,
        api,
        send,
        money,
        chip,
        empty,
        initShell,
        duration,
        countryTag,
        iconLabel,
      } = App;
      initShell("trips");
      const state = { hourlyRate: 0, postcode: "" };

      const statusKind = (status) =>
        status === "good" ? "good" : status === "time" ? "warn" : "bad";
      const statusLabel = (status, tooLong = false) =>
        tooLong ? "Langer dan je maximale tijd" : statusLabelBase(status);
      const statusLabelBase = (status) =>
        status === "good"
          ? "Rendabel"
          : status === "time"
            ? "Rendabel in geld, niet in tijd"
            : "Niet de moeite waard";
      const signed = (n) => `${n >= 0 ? "+" : "−"}${money(Math.abs(n))}`;
      const storeLabel = (s) =>
        `${s.storeName}${countryTag(s.country)}${s.followed ? " (gevolgd)" : ""}`;

      /** Google Maps directions: home -> stops -> home. */
      const mapsUrl = (stops) => {
        const home = `${state.postcode}, Nederland`;
        const waypoints = stops
          .filter((p) => p.lat !== undefined && p.lon !== undefined)
          .map((p) => `${p.lat},${p.lon}`)
          .join("|");
        const params = new URLSearchParams({
          api: "1",
          origin: home,
          destination: home,
          travelmode: "driving",
        });
        if (waypoints) params.set("waypoints", waypoints);
        return `https://www.google.com/maps/dir/?${params.toString()}`;
      };

      /** "Bekijk op kaart" + "Naar mijn telefoon" for a set of stops. */
      const mapActions = (stops, title) => {
        const url = mapsUrl(stops);
        const open = el("a", {
          className: "btn mini",
          href: url,
          target: "_blank",
          rel: "noopener",
        });
        open.append(iconLabel("map", "Bekijk op kaart"));
        const share = el("button", {
          className: "secondary mini",
        });
        share.append(iconLabel("phone", "Naar mijn telefoon"));
        share.onclick = async () => {
          share.disabled = true;
          try {
            await send("/api/trips/share", "POST", { url, title });
            share.replaceChildren(iconLabel("check", "Verstuurd"));
          } catch (e) {
            share.textContent = e.message;
            share.disabled = false;
          }
        };
        return el("div", { className: "map-actions" }, open, share);
      };

      /** Small button that ticks the given units off the shopping list and recalculates. */
      const doneButton = (
        units,
        title = "Zet deze aantallen met deze prijzen als gekocht op je boodschappenlijst",
      ) => {
        const btn = el("button", {
          className: "secondary mini",
          title,
        });
        btn.append(iconLabel("check", "Gehaald"));
        btn.onclick = async () => {
          btn.disabled = true;
          try {
            await send("/api/list/purchase", "POST", { items: units });
            await render();
          } catch (e) {
            btn.textContent = e.message;
          }
        };
        return btn;
      };

      /** One labelled figure in a facts grid. */
      const fact = (label, value, extra = "") =>
        el(
          "div",
          { className: `fact ${extra}`.trim() },
          el("small", { textContent: label }),
          el("strong", { textContent: value }),
        );

      const timeFacts = (x) => [
        fact("Rijtijd", duration(x.driveMinutes)),
        fact("In de winkel", duration(x.stopMinutes)),
        fact("Totale tijd", duration(x.totalMinutes)),
        ...(state.hourlyRate > 0
          ? [
              fact(
                `Tijdkosten (${money(state.hourlyRate)}/uur)`,
                money(x.timeCost),
              ),
              fact("Netto in geld", money(x.moneyNet)),
            ]
          : []),
      ];

      const routeTitle = (r) => {
        const names = r.stops.map(storeLabel);
        return names.length === 1
          ? names[0]
          : names.length === 2
            ? `${names[0]} via ${names[1]}`
            : `${names[0]} via ${names.slice(1, -1).join(", ")} naar ${names[names.length - 1]}`;
      };

      const routeBody = (r) => [
        el(
          "div",
          { className: "facts" },
          fact("Afstand totaal", `${r.totalKm} km`),
          ...timeFacts(r),
          fact("Brandstof", money(r.tripCost)),
          fact("Besparing", money(r.saving)),
          fact("Te betalen", money(r.spend)),
        ),
        r.approximateOrder
          ? el("p", {
              className: "hint",
              textContent: "Volgorde is een benadering (meer dan 4 stops).",
            })
          : null,
        mapActions(r.stops, routeTitle(r)),
        el(
          "div",
          { className: "stops" },
          ...r.stops.map((s) =>
            el(
              "div",
              { className: "stop" },
              el(
                "div",
                { className: "where" },
                storeLabel(s),
                el("small", {
                  textContent: `${s.legKm} km · ${duration(s.legMinutes)} rijden`,
                }),
              ),
              el("div", {
                className: "what",
                textContent: s.units
                  .map((u) => `${u.count}× ${u.name}`)
                  .join(", "),
              }),
              doneButton(
                s.units.map((u) => ({
                  articleNumber: u.articleNumber,
                  count: u.count,
                  unitPrice: Math.round((u.spend / u.count) * 100) / 100,
                  storeName: s.storeName,
                })),
              ),
            ),
          ),
        ),
      ];

      const bestPanel = (r) => {
        if (!r) return null;
        const gain = r.gainOverSingle;
        return el(
          "section",
          { className: `panel trip route ${statusKind(r.status)}` },
          el(
            "header",
            {},
            el("h3", { textContent: `Slimste route: ${routeTitle(r)}` }),
            chip(statusLabel(r.status), statusKind(r.status)),
            el("span", {
              className: `net ${statusKind(r.status)}`,
              textContent: signed(r.net),
            }),
          ),
          r.stops.length > 1 && r.bestSingleName
            ? el("p", {
                className: "hint",
                textContent:
                  gain > 0
                    ? `${money(gain)} beter dan alleen ${r.bestSingleName}`
                    : `Even goed als alleen ${r.bestSingleName}`,
              })
            : null,
          ...routeBody(r),
        );
      };

      const altRoute = (r) =>
        el(
          "details",
          { className: "alt" },
          el(
            "summary",
            {},
            el("strong", { textContent: routeTitle(r) }),
            chip(statusLabel(r.status), statusKind(r.status)),
            el("span", {
              className: "meta",
              textContent: `${r.totalKm} km · ${duration(r.totalMinutes)}`,
            }),
            el("span", {
              className: `net ${statusKind(r.status)}`,
              textContent: signed(r.net),
            }),
          ),
          el("div", {}, ...routeBody(r)),
        );

      const storeCard = (t) => {
        const lines = t.items.filter((i) => i.found > 0);
        return el(
          "section",
          { className: "panel trip" },
          el(
            "header",
            {},
            el("h3", { textContent: storeLabel(t) }),
            chip(statusLabel(t.status, t.tooLong), statusKind(t.status)),
            el("span", {
              className: `net ${statusKind(t.status)}`,
              textContent: signed(t.net),
            }),
          ),
          el(
            "div",
            { className: "facts" },
            fact(
              "Enkele reis",
              `${t.distanceSource === "estimate" ? "~" : ""}${t.oneWayKm} km`,
            ),
            ...timeFacts(t),
            fact("Brandstof", money(t.tripCost)),
            fact("Besparing", money(t.saving)),
            fact("Te betalen", money(t.spend)),
          ),
          ...lines.map((i) =>
            el(
              "div",
              { className: "line" },
              el("a", {
                href: `/product/${i.articleNumber}`,
                textContent: i.name,
              }),
              el("span", {
                className: "num",
                textContent: `${i.found} van ${i.wanted}`,
              }),
              el("span", { className: "num", textContent: money(i.spend) }),
              el("span", {
                className: "num meta",
                textContent: i.saving
                  ? `bespaart ${money(i.saving)}`
                  : "nieuwprijs onbekend",
              }),
            ),
          ),
          mapActions([t], storeLabel(t)),
          el(
            "div",
            { className: "footer-actions" },
            doneButton(
              lines.map((i) => ({
                articleNumber: i.articleNumber,
                count: i.found,
                unitPrice: Math.round((i.spend / i.found) * 100) / 100,
                storeName: t.storeName,
              })),
            ),
          ),
        );
      };

      async function render() {
        $("summary").textContent = "Afstanden berekenen…";
        let data;
        try {
          data = await api("/api/trips");
        } catch (e) {
          $("summary").textContent = "";
          $("trips").replaceChildren(empty(`Berekenen mislukt: ${e.message}`));
          return;
        }
        $("summary").textContent = "";
        if (!data.configured) {
          const target = data.reason.includes("postcode")
            ? ["/settings#ritje", "Naar instellingen"]
            : data.reason.includes("gehaald")
              ? ["/watchlist#boodschappen", "Naar boodschappenlijst"]
              : ["/watchlist", "Naar lijsten"];
          $("routes").replaceChildren();
          $("trips").replaceChildren(
            el(
              "div",
              { className: "empty" },
              `${data.reason}. `,
              el("a", { href: target[0], textContent: target[1] }),
            ),
          );
          return;
        }
        state.hourlyRate = data.hourlyRate;
        state.postcode = data.postcode;
        $("summary").replaceChildren(
          ...[
            ["Vanaf", data.postcode],
            ["Benzine", `${money(data.fuelPrice)}/l`],
            ["Verbruik", `${data.consumptionPer100km} l/100 km`],
            ["Nog nodig", `${data.wantedUnits} stuks`],
          ].map(([k, v]) => fact(k, v)),
        );

        // The best route is shown first; single stores only when it is not itself a single store.
        const alternatives = data.alternatives;
        $("routes").replaceChildren(
          ...(data.bestRoute
            ? [bestPanel(data.bestRoute)]
            : data.maxTripMinutes > 0
              ? [
                  empty(
                    `Geen route binnen ${duration(data.maxTripMinutes)} die iets oplevert.`,
                  ),
                ]
              : []),
          ...(alternatives.length
            ? [
                el("h2", {
                  className: "section",
                  textContent: `Andere rendabele routes (${alternatives.length})`,
                }),
                ...alternatives.map(altRoute),
              ]
            : []),
        );

        const relevant = data.stores.filter((t) =>
          t.items.some((i) => i.found > 0),
        );
        const empties = data.stores.filter(
          (t) => !t.items.some((i) => i.found > 0),
        );
        $("trips").replaceChildren(
          el("h2", { className: "section", textContent: "Per filiaal" }),
          ...(relevant.length
            ? relevant.map(storeCard)
            : [empty("Niets van je lijst ligt nu in een filiaal.")]),
          ...(empties.length
            ? [
                el(
                  "details",
                  { className: "panel" },
                  el("summary", {
                    textContent: `${empties.length} filialen hebben niets van je lijst`,
                  }),
                  el(
                    "div",
                    { className: "facts" },
                    ...empties.map((t) =>
                      el("span", {
                        textContent: `${t.storeName}${countryTag(t.country)} (${t.oneWayKm} km)`,
                      }),
                    ),
                  ),
                ),
              ]
            : []),
        );
      }
      render();
    </script>
  </body>
</html>
