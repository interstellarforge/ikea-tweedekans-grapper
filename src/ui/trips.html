<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ritje-check · IKEA Tweedekans</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <style>
      .route.warn {
        border-color: var(--warn);
      }
      .net.warn {
        color: var(--warn);
      }
      .route.good {
        border-color: var(--good);
      }
      #summary {
        margin: 0 0 14px;
      }
      .trip {
        padding: 14px 16px;
      }
      .trip header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: baseline;
      }
      .trip h2 {
        margin: 0;
        font-size: 18px;
      }
      .net {
        margin-left: auto;
        font-size: 20px;
        font-weight: 800;
      }
      .net.good {
        color: var(--good);
      }
      .net.bad {
        color: var(--bad);
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        margin: 8px 0;
        color: var(--muted);
        font-size: 13px;
      }
      ul.lines {
        list-style: none;
        padding: 0;
        margin: 8px 0 0;
      }
      ul.lines li {
        display: flex;
        gap: 10px;
        padding: 4px 0;
        border-top: 1px solid var(--line);
        flex-wrap: wrap;
      }
      ul.lines .name {
        flex: 1 1 220px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ritje-check</h1>
      <p class="lead">
        Per filiaal: is het de rit waard? Besparing t.o.v. nieuwprijs op de
        producten uit je watchlist (aantal nodig per product), minus
        brandstofkosten van de retour-rit.
      </p>
      <div id="summary" class="hint"></div>
      <div id="route"></div>
      <div id="trips"></div>
    </main>
    <script src="/assets/app.js"></script>
    <script>
      const {
        $,
        el,
        api,
        money,
        chip,
        empty,
        initShell,
        duration,
        countryTag,
      } = App;
      initShell("trips");

      const state = { hourlyRate: 0 };
      const statusKind = (status) =>
        status === "good" ? "good" : status === "time" ? "warn" : "bad";
      const statusLabel = (status) =>
        status === "good"
          ? "Rit is de moeite waard"
          : status === "time"
            ? "Rendabel in geld, niet in tijd"
            : "Niet de moeite waard";
      const timeFacts = (x, hourlyRate) =>
        hourlyRate > 0
          ? [
              el("span", {
                textContent: `Tijdkosten: ${money(x.timeCost)} (${money(hourlyRate)}/uur)`,
              }),
              el("span", {
                textContent: `Netto in geld: ${money(x.moneyNet)}`,
              }),
            ]
          : [];

      const trip = (t) => {
        const lines = t.items.filter((i) => i.found > 0);
        return el(
          "section",
          { className: "panel trip" },
          el(
            "header",
            {},
            el("h2", {
              textContent: `${t.followed ? "★ " : ""}${t.storeName}${countryTag(t.country)}`,
            }),
            chip(
              lines.length
                ? statusLabel(t.status)
                : "Niets van je lijst aanwezig",
              lines.length ? statusKind(t.status) : "",
            ),
            el("span", {
              className: `net ${statusKind(t.status)}`,
              textContent: lines.length
                ? `${t.net >= 0 ? "+" : "−"}${money(Math.abs(t.net))}`
                : "–",
            }),
          ),
          el(
            "div",
            { className: "facts" },
            el("span", {
              textContent: `${t.oneWayKm} km enkele reis${t.distanceSource === "estimate" ? " (schatting)" : ""}`,
            }),
            el("span", {
              textContent: `Tijd: ${duration(t.driveMinutes)} rijden + ${duration(t.stopMinutes)} in de winkel = ${duration(t.totalMinutes)}`,
            }),
            el("span", {
              textContent: `Ritkosten: ${money(t.tripCost)} (${t.roundTripKm} km)`,
            }),
            el("span", { textContent: `Besparing: ${money(t.saving)}` }),
            ...timeFacts(t, state.hourlyRate),
            el("span", { textContent: `Te betalen: ${money(t.spend)}` }),
          ),
          lines.length
            ? el(
                "ul",
                { className: "lines" },
                ...lines.map((i) =>
                  el(
                    "li",
                    {},
                    el("a", {
                      className: "name",
                      href: `/product/${i.articleNumber}`,
                      textContent: i.name,
                    }),
                    el("span", { textContent: `${i.found} van ${i.wanted}` }),
                    el("span", { textContent: money(i.spend) }),
                    el("span", {
                      className: "meta",
                      textContent: i.saving
                        ? `bespaart ${money(i.saving)}`
                        : "nieuwprijs onbekend",
                    }),
                  ),
                ),
              )
            : null,
          lines.length
            ? purchaseButton(
                lines.map((i) => ({
                  articleNumber: i.articleNumber,
                  count: i.found,
                })),
              )
            : null,
        );
      };

      /** Ticks the given units off the shopping list and recalculates. */
      const purchaseButton = (units) => {
        const btn = el("button", {
          className: "secondary",
          textContent: "Gehaald — afstrepen",
        });
        btn.onclick = async () => {
          btn.disabled = true;
          btn.textContent = "Afstrepen…";
          try {
            await send("/api/list/purchase", "POST", { items: units });
            await render();
          } catch (e) {
            btn.textContent = e.message;
          }
        };
        return btn;
      };

      const routePanel = (r, data) => {
        if (!r || r.stops.length < 2) return null;
        const names = r.stops.map((s) => s.storeName + countryTag(s.country));
        const title =
          names.length === 2
            ? `Rij naar ${names[0]} via ${names[1]}`
            : `Rij naar ${names[0]} via ${names.slice(1, -1).join(", ")} naar ${names[names.length - 1]}`;
        const gain = r.gainOverSingle;
        return el(
          "section",
          { className: `panel trip route ${statusKind(r.status)}` },
          el(
            "header",
            {},
            el("h2", { textContent: `Slimste route: ${title}` }),
            chip(statusLabel(r.status), statusKind(r.status)),
            el("span", {
              className: `net ${statusKind(r.status)}`,
              textContent: `${r.net >= 0 ? "+" : "−"}${money(Math.abs(r.net))}`,
            }),
          ),
          el(
            "div",
            { className: "facts" },
            el("span", {
              textContent: `${r.totalKm} km totaal (thuis → ${names.join(" → ")} → thuis)`,
            }),
            el("span", {
              textContent: `Tijd: ${duration(r.driveMinutes)} rijden + ${duration(r.stopMinutes)} in de winkels = ${duration(r.totalMinutes)}`,
            }),
            r.approximateOrder
              ? el("span", {
                  className: "err",
                  textContent: "Volgorde is een benadering (meer dan 4 stops)",
                })
              : null,
            el("span", { textContent: `Ritkosten: ${money(r.tripCost)}` }),
            el("span", { textContent: `Besparing: ${money(r.saving)}` }),
            ...timeFacts(r, state.hourlyRate),
            el("span", { textContent: `Te betalen: ${money(r.spend)}` }),
            r.bestSingleName
              ? el("span", {
                  textContent:
                    gain > 0
                      ? `${money(gain)} beter dan alleen ${r.bestSingleName}`
                      : `Even goed als alleen ${r.bestSingleName}`,
                })
              : null,
          ),
          el(
            "ul",
            { className: "lines" },
            ...r.stops.map((s) =>
              el(
                "li",
                {},
                el("strong", {
                  className: "name",
                  textContent: `${s.followed ? "★ " : ""}${s.storeName}${countryTag(s.country)} (${s.legKm} km, ${duration(s.legMinutes)})`,
                }),
                el(
                  "span",
                  {},
                  s.units.map((u) => `${u.count}× ${u.name}`).join(", "),
                ),
                purchaseButton(
                  s.units.map((u) => ({
                    articleNumber: u.articleNumber,
                    count: u.count,
                  })),
                ),
              ),
            ),
          ),
        );
      };

      async function render() {
        $("summary").textContent = "Afstanden berekenen…";
        let data;
        try {
          data = await api("/api/trips");
        } catch (e) {
          $("summary").textContent = "";
          $("trips").replaceChildren(empty(`Berekenen mislukt: ${e.message}`));
          return;
        }
        $("summary").textContent = "";
        if (!data.configured) {
          $("trips").replaceChildren(
            el(
              "div",
              { className: "empty" },
              `${data.reason}. `,
              el("a", {
                href: data.reason.includes("postcode")
                  ? "/settings"
                  : data.reason.includes("gehaald")
                    ? "/list"
                    : "/watchlist",
                textContent: data.reason.includes("postcode")
                  ? "Naar instellingen"
                  : data.reason.includes("gehaald")
                    ? "Naar boodschappenlijst"
                    : "Naar watchlist",
              }),
            ),
          );
          return;
        }
        $("summary").textContent =
          `Vanaf ${data.postcode} · benzine ${money(data.fuelPrice)}/l · ${data.consumptionPer100km} l/100 km · ${data.wantedUnits} stuks nodig`;
        state.hourlyRate = data.hourlyRate;
        $("route").replaceChildren(
          ...[routePanel(data.bestRoute, data)].filter(Boolean),
        );
        const relevant = data.stores.filter((t) =>
          t.items.some((i) => i.found > 0),
        );
        const empties = data.stores.filter(
          (t) => !t.items.some((i) => i.found > 0),
        );
        $("trips").replaceChildren(
          ...relevant.map(trip),
          ...(empties.length
            ? [
                el(
                  "details",
                  { className: "panel" },
                  el("summary", {
                    textContent: `${empties.length} filialen hebben niets van je lijst`,
                  }),
                  el(
                    "div",
                    { className: "facts" },
                    ...empties.map((t) =>
                      el("span", {
                        textContent: `${t.storeName}${countryTag(t.country)} (${t.oneWayKm} km)`,
                      }),
                    ),
                  ),
                ),
              ]
            : []),
        );
      }
      render();
    </script>
  </body>
</html>
