<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profiel · Tweedekanshoek</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <style>
      .who {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 8px;
      }
      .big-avatar {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--brand);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 24px;
        font-weight: 700;
      }
      .field {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 8px 12px;
        align-items: center;
        margin-bottom: 10px;
      }
      .field input {
        width: 100%;
        max-width: 360px;
      }
      @media (max-width: 600px) {
        .field {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Profiel</h1>
      <section class="panel">
        <div class="who">
          <div class="big-avatar" id="letter">·</div>
          <div>
            <strong id="name">…</strong>
            <div class="hint">Ingelogd</div>
          </div>
        </div>
        <button class="secondary" id="logout">Uitloggen</button>
      </section>

      <section class="panel" id="pwPanel">
        <h2>Wachtwoord wijzigen</h2>
        <p class="hint">
          Het nieuwe wachtwoord vervangt het wachtwoord uit de configuratie.
          Andere sessies worden uitgelogd.
        </p>
        <div class="field">
          <label for="current">Huidig wachtwoord</label>
          <input type="password" id="current" autocomplete="current-password" />
        </div>
        <div class="field">
          <label for="next">Nieuw wachtwoord (min. 8 tekens)</label>
          <input type="password" id="next" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="again">Herhaal nieuw wachtwoord</label>
          <input type="password" id="again" autocomplete="new-password" />
        </div>
        <div class="row">
          <button id="save">Wachtwoord opslaan</button>
          <span id="msg" class="hint"></span>
        </div>
      </section>
    </main>
    <script src="/assets/app.js"></script>
    <script>
      const { $, api, send, initShell } = App;
      initShell("profile");

      const flash = (text, isError) => {
        $("msg").textContent = text;
        $("msg").className = isError ? "err" : "hint";
      };

      api("/api/profile").then((p) => {
        $("name").textContent = p.email || "Gebruiker";
        $("letter").textContent = (p.email || "?").charAt(0).toUpperCase();
      });

      $("logout").onclick = async () => {
        await fetch("/api/logout", { method: "POST" });
        location.href = "/login";
      };

      $("save").onclick = async () => {
        if ($("next").value !== $("again").value) {
          flash("De nieuwe wachtwoorden komen niet overeen", true);
          return;
        }
        try {
          await send("/api/profile/password", "PUT", {
            current: $("current").value,
            next: $("next").value,
          });
          for (const id of ["current", "next", "again"]) $(id).value = "";
          flash("Wachtwoord gewijzigd");
        } catch (e) {
          flash(e.message, true);
        }
      };
    </script>
  </body>
</html>
