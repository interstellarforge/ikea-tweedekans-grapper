<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zoeken in producten · Tweedekanshoek</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <style>
      .starter h2 {
        font-size: 18px;
        margin: 8px 0 4px;
      }
      .starter-group {
        padding: 14px 0;
        border-top: 1px solid var(--line);
      }
      .starter-group h3 {
        font-size: 14px;
        color: var(--muted);
        margin: 0 0 8px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Zoeken in producten</h1>
      <p class="lead">
        Zoek in de volledige IKEA-catalogus (naam of artikelnummer) en zet
        producten op je watchlist.
      </p>
      <div class="toolbar">
        <input
          type="search"
          id="q"
          placeholder="Bijv. KALLAX, BILLY, 90591705"
          autofocus
        />
      </div>
      <div id="status" class="hint"></div>
      <section id="starter" class="starter">
        <h2>Veelgezocht</h2>
        <p class="lead">
          Kies een serie of zoek op naam of artikelnummer. Series die vaak in de
          tweedekanshoek liggen staan hieronder.
        </p>
        <div id="groups"></div>
      </section>
      <div class="grid" id="results"></div>
    </main>
    <script src="/assets/app.js"></script>
    <script>
      const {
        $,
        el,
        send,
        api,
        initShell,
        insightChips,
        debounce,
        empty,
        addToList,
      } = App;
      initShell("catalog");

      const STARTERS = [
        ["Keuken", ["METOD", "SEKTION", "KNOXHULT", "ENHET"]],
        ["Kasten en opbergen", ["PAX", "BILLY", "KALLAX", "BESTÅ", "IVAR"]],
        ["Slaapkamer", ["MALM", "HEMNES", "BRIMNES", "SONGESAND"]],
        ["Wonen en werken", ["LACK", "POÄNG", "ALEX", "MICKE", "LINNMON"]],
        ["Onderdelen", ["KOMPLEMENT", "UTRUSTA", "MAXIMERA", "RATIONELL"]],
      ];
      const renderStarter = () => {
        $("groups").replaceChildren(
          ...STARTERS.map(([title, names]) =>
            el(
              "div",
              { className: "starter-group" },
              el("h3", { textContent: title }),
              el(
                "div",
                { className: "chips" },
                ...names.map((n) => {
                  const b = el("button", {
                    className: "pill",
                    textContent: n,
                  });
                  b.onclick = () => {
                    $("q").value = n;
                    search();
                  };
                  return b;
                }),
              ),
            ),
          ),
        );
      };
      renderStarter();

      async function search() {
        const q = $("q").value.trim();
        $("starter").hidden = q.length >= 2;
        if (q.length < 2) {
          $("status").textContent = "";
          $("results").replaceChildren();
          return;
        }
        $("status").textContent = "Zoeken…";
        let items;
        try {
          items = await api("/api/catalog?q=" + encodeURIComponent(q));
        } catch (e) {
          $("status").textContent = `Zoeken mislukt: ${e.message}`;
          return;
        }
        $("status").textContent = `${items.length} producten`;
        if (!items.length)
          return $("results").replaceChildren(
            empty("Geen producten gevonden."),
          );
        $("results").replaceChildren(
          ...items.map((p) => {
            const btn = el("button", {
              textContent: p.watched ? "Op watchlist" : "Volgen",
              disabled: p.watched,
            });
            btn.onclick = async () => {
              btn.disabled = true;
              await send("/api/watchlist", "PUT", p);
              btn.textContent = "Op watchlist";
            };
            const toList = el("button", {
              className: "secondary",
              textContent: "Op lijst",
              title: "Op een boodschappenlijst zetten",
            });
            toList.onclick = () => addToList(p);
            const chips = insightChips(p.insight);
            return el(
              "div",
              { className: "card" },
              el(
                "a",
                { href: `/product/${p.articleNumber}` },
                el("img", { src: p.image || "", loading: "lazy", alt: "" }),
              ),
              el(
                "div",
                { className: "body" },
                el("a", {
                  className: "title",
                  href: `/product/${p.articleNumber}`,
                  style: "color:inherit;text-decoration:none",
                  textContent: `${p.name} ${p.typeName}`,
                }),
                el("div", {
                  className: "meta",
                  textContent: `art. ${p.articleNumber}${p.measure ? " · " + p.measure : ""}`,
                }),
                chips,
                el("div", { className: "spacer" }),
                el(
                  "div",
                  { className: "row", style: "margin:0" },
                  btn,
                  toList,
                  p.url
                    ? el("a", {
                        href: p.url,
                        target: "_blank",
                        rel: "noopener",
                        textContent: "Op IKEA.nl",
                      })
                    : null,
                ),
              ),
            );
          }),
        );
      }

      $("q").oninput = debounce(search);
    </script>
  </body>
</html>
