# Self-hosted ntfy behind Nginx Proxy Manager.
# Usage: cp .env.example .env && edit && docker compose up -d
services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    restart: unless-stopped
    ports:
      # Host port the proxy forwards to (8081 is already in use on jupiter).
      - "${NTFY_PORT:-8097}:80"
    environment:
      # Public URL as served by Nginx Proxy Manager (used in links and attachments).
      NTFY_BASE_URL: ${NTFY_BASE_URL:?set NTFY_BASE_URL in .env}
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 48h
      # Only needed for instant push to iOS; harmless otherwise.
      NTFY_UPSTREAM_BASE_URL: ${NTFY_UPSTREAM_BASE_URL:-}
      TZ: Europe/Amsterdam
    volumes:
      - ./cache:/var/cache/ntfy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:80/v1/health || exit 1",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
